<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | DraftOne</title>
    <link rel="icon" type="image/png" href="draftone logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body id="top" class="contact-page-body">
    <!-- Navigation Bar: identical structure and styling to the landing page navbar -->
    <div id="navbar" class="navbar-light">
        <div class="nav-logo"></div>
        <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="fullscreen-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>

    <!-- Main Content -->
    <main class="contact-main">
        <section class="contact-section" aria-label="Contact Information and Form">
            <div class="contact-container">
                <div class="contact-grid">
                    <!-- LEFT COLUMN: Contact Information -->
                    <div class="contact-info">
                        <h1 class="contact-title">Let’s talk design</h1>
                        <p class="contact-description">
                            Schedule a call to discuss your project<br />
                            or get expert advice from our team.
                        </p>

                        <div class="contact-details">
                            <div class="contact-block">
                                <span class="contact-label">Address</span>
                                <p class="contact-value">Noida, UP</p>
                            </div>

                            <div class="contact-block">
                                <span class="contact-label">Contact</span>
                                <p class="contact-value">
                                    <a href="tel:+919151090902" class="contact-link">+91 9151090902</a>
                                </p>
                            </div>

                            <div class="contact-block">
                                <span class="contact-label">Email</span>
                                <p class="contact-value">
                                    <a href="mailto:admin@draftone.in" class="contact-link">admin@draftone.in</a>
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT COLUMN: Contact Form -->
                    <div class="contact-form-wrap">
                        <form class="contact-form" id="contactForm" novalidate>
                            <!-- Honeypot anti-spam field (hidden from users) -->
                            <div style="display:none;" aria-hidden="true">
                                <input type="text" name="website" tabindex="-1" autocomplete="off">
                            </div>

                            <!-- NAME -->
                            <div class="form-control">
                                <input type="text" name="name" id="name" required autocomplete="name" />
                                <label for="name">
                                    <span style="transition-delay:0ms">N</span>
                                    <span style="transition-delay:50ms">a</span>
                                    <span style="transition-delay:100ms">m</span>
                                    <span style="transition-delay:150ms">e</span>
                                </label>
                            </div>

                            <!-- EMAIL -->
                            <div class="form-control">
                                <input type="email" name="email" id="email" required autocomplete="email" />
                                <label for="email">
                                    <span style="transition-delay:0ms">E</span>
                                    <span style="transition-delay:50ms">m</span>
                                    <span style="transition-delay:100ms">a</span>
                                    <span style="transition-delay:150ms">i</span>
                                    <span style="transition-delay:200ms">l</span>
                                </label>
                            </div>

                            <!-- MESSAGE -->
                            <div class="form-control textarea">
                                <textarea name="message" id="message" required></textarea>
                                <label for="message">
                                    <span style="transition-delay:0ms">M</span>
                                    <span style="transition-delay:50ms">e</span>
                                    <span style="transition-delay:100ms">s</span>
                                    <span style="transition-delay:150ms">s</span>
                                    <span style="transition-delay:200ms">a</span>
                                    <span style="transition-delay:250ms">g</span>
                                    <span style="transition-delay:300ms">e</span>
                                </label>
                            </div>

                            <!-- Form Status Message (Success / Error Alert) -->
                            <div class="form-status" id="formStatus" aria-live="polite" role="status"></div>

                            <!-- Submit Button -->
                            <button type="submit" class="submitbutton" id="submitBtn">
                                <span class="button_lg">
                                    <span class="button_sl"></span>
                                    <span class="button_text">Submit Now</span>
                                </span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>


    <!-- Editorial Light Footer -->
    <footer id="site-footer">
        <div class="footer-container">
            <!-- BOTTOM: Copyright -->
            <div class="footer-bottom">
                <p class="footer-copyright">© DraftOne Media Productions. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Full-screen overlay menu -->
    <nav class="fullscreen-menu" id="fullscreen-menu" aria-hidden="true" aria-label="Main navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="careers.html">Careers</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- GSAP & Plugins for smooth menu and back-to-top animation -->
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script src="node_modules/gsap/dist/ScrollTrigger.min.js"></script>
    <script src="node_modules/gsap/dist/ScrollToPlugin.min.js"></script>
    <script>
        if (typeof gsap === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"><\/script>');
            document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"><\/script>');
            document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollToPlugin.min.js"><\/script>');
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
