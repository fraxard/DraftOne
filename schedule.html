<!DOCTYPE html>
<html lang="en" class="schedule-html">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Session | DraftOne</title>
    <link rel="icon" type="image/png" href="draftone logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body id="top" class="schedule-page">
    <!-- Navigation Bar: identical structure and styling to the landing page navbar -->
    <div id="navbar" class="navbar-light">
        <div class="nav-logo"></div>
        <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="fullscreen-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>

    <!-- Main Content: Single viewport container for Calendly -->
    <main class="schedule-main">
        <div class="schedule-container">
            <div class="calendly-wrapper">
                <!-- Minimal Editorial Loader -->
                <div class="calendly-loader" id="calendlyLoader">
                    <div class="loader-text">Preparing your session</div>
                    <div class="loader-bar"></div>
                </div>

                <!-- Existing Calendly Inline Widget -->
                <div class="calendly-inline-widget" data-url="https://calendly.com/infodraftone/30min" style="opacity:0" id="calendlyWidget">
                </div>
            </div>
        </div>
    </main>

    <!-- Full-screen overlay menu -->
    <nav class="fullscreen-menu" id="fullscreen-menu" aria-hidden="true" aria-label="Main navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="careers.html">Careers</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- GSAP & Plugins for smooth menu animation -->
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script src="node_modules/gsap/dist/ScrollTrigger.min.js"></script>
    <script src="node_modules/gsap/dist/ScrollToPlugin.min.js"></script>
    <script>
        if (typeof gsap === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"><\/script>');
            document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"><\/script>');
            document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollToPlugin.min.js"><\/script>');
        }
    </script>
    <script src="script.js"></script>

    <!-- Calendly Integration Script -->
    <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
    <script>
        const loader = document.getElementById("calendlyLoader");
        const widget = document.getElementById("calendlyWidget");

        const checkCalendly = setInterval(() => {
            const iframe = widget ? widget.querySelector("iframe") : null;
            if (iframe) {
                iframe.onload = () => {
                    if (loader) {
                        loader.style.opacity = "0";
                        setTimeout(() => {
                            loader.style.display = "none";
                            if (widget) {
                                widget.style.opacity = "1";
                                widget.style.pointerEvents = "auto";
                            }
                        }, 400);
                    }
                };
                if (iframe.contentDocument && iframe.contentDocument.readyState === "complete") {
                    iframe.onload();
                }
                clearInterval(checkCalendly);
            }
        }, 200);

        // Fallback safety timeout if iframe doesn't fire load event
        setTimeout(() => {
            if (loader && loader.style.display !== 'none') {
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                    if (widget) {
                        widget.style.opacity = "1";
                        widget.style.pointerEvents = "auto";
                    }
                }, 400);
            }
        }, 4000);
    </script>
</body>

</html>
